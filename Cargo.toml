[package]
name = "syncme"
version = "0.1.0"
edition = "2024"

[features]
default = ["tray"]
# Tray icon / menu bar item. Build with --no-default-features for headless servers (no GTK needed on Linux).
tray = ["dep:tray-icon", "dep:tao"]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
blake3 = "1.8.7"
dirs = "7.0.0"
filetime = "0.2.29"
futures-util = "0.3.34"
hostname = "0.4.2"
mdns-sd = "0.21.4"
notify = "8.2.0"
open = "5.4.4"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tao = { version = "0.37.1", optional = true }
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tray-icon = { version = "0.25.1", optional = true }
uuid = { version = "1.26.1", features = ["v4"] }
walkdir = "2.5.0"
